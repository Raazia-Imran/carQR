    "/public/tags/{token}/incidents": {
      "post": {
        "summary": "Persist incident and delivery stages atomically",
        "operationId": "post_public_tags_token_incidents",
        "tags": [
          "scanner"
        ],
        "security": [
          {
            "scannerCookie": []
          }
        ],
        "responses": {
          "200": {
            "description": "Action succeeded; see docs/API.md for exact projection"
          },
          "default": {
            "description": "Safe application error",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "201": {
            "description": "Incident accepted or matching idempotent retry; never a delivery guarantee"
          }
        },
        "parameters": [
          {
            "name": "token",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string"
            }
          },
          {
            "name": "Origin",
            "in": "header",
            "required": true,
            "schema": {
              "type": "string"
            },
            "description": "Must exactly equal configured APP_ORIGIN"
          },
          {
            "name": "Idempotency-Key",
            "in": "header",
            "required": true,
            "schema": {
              "type": "string",
              "minLength": 8,
              "maxLength": 128
            }
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "additionalProperties": false,
                "properties": {
                  "reason": {
                    "type": "string",
                    "enum": [
                      "blocked_access",
                      "lights_on",
                      "window_open",
                      "visible_damage",
                      "urgent_concern"
                    ]
                  },
                  "location": {
                    "type": "object",
                    "additionalProperties": false,
                    "properties": {
                      "latitude": {
                        "type": "number",
                        "minimum": -90,
                        "maximum": 90
                      },
                      "longitude": {
                        "type": "number",
                        "minimum": -180,
                        "maximum": 180
                      },
                      "accuracy": {
                        "type": "number",
                        "minimum": 0,
                        "maximum": 100000
                      }
                    },
                    "required": [
                      "latitude",
                      "longitude",
                      "accuracy"
                    ]
                  },
                  "challengeToken": {
                    "type": "string",
                    "maxLength": 2048
                  }
                },
                "required": [
                  "reason"
                ]
              }
            }
          }
        }
      }
    },
