name: Application checks
on:
  pull_request:
  push:
    branches: [main, feat/phase-a-application]
permissions:
  contents: read
jobs:
  windows-regression:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: qrcar
          POSTGRES_PASSWORD: ci-only-not-a-secret
          POSTGRES_DB: qrcar_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U qrcar -d qrcar_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
        env:
          TEST_DATABASE_URL: postgresql://qrcar:ci-only-not-a-secret@localhost:5432/qrcar_test
      - run: npm run local:setup
      - run: npm run db:migrate
        env:
          DATABASE_URL: postgresql://qrcar:ci-only-not-a-secret@localhost:5432/qrcar_test
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
      - run: npm audit --omit=dev
